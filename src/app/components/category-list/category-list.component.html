@if (categories()) {
  <div class="d-flex flex-wrap gap-2 mb-3">
    <button type="button" class="btn btn-secondary" (click)="select(null)">Todas</button>

    @for (cat of categories(); track cat) {
      <button type="button" class="btn btn-primary" (click)="select(cat)">{{ cat }}</button>
    }
  </div>
} @else {
  <p>Carregando categorias...</p>
}
