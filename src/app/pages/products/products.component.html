<h2>Nossos Produtos (da API!)</h2>

<!-- Lista de categorias -->
<app-category-list (categorySelected)="onCategorySelected($event)"></app-category-list>

@if (products()) {
  <ul>
    @for (product of products(); track product.id) {
      <li>
        <a [routerLink]="['/products', product.id]">{{ product.title }}</a>
        <span> - {{ product.price | currency:'BRL' }}</span>
      </li>
    }
  </ul>
} @else {
  <p>Carregando produtos...</p>
}
